<!--
title: {{titulo_pagina}}
description: {{descricao}}
nav: blog
-->
<main class="theme-light">
  <article class="post-page">
    <header class="post-head">
      <div class="wrap">
        <nav class="crumbs" aria-label="Você está em"><a href="/">Início</a><span aria-hidden="true">/</span><a href="/blog/">Blog</a><span aria-hidden="true">/</span><a href="/blog/categoria/{{cat_slug}}/">{{cat_nome}}</a></nav>
        {{{aviso_rascunho}}}
        <h1>{{titulo}}</h1>
        <p class="lead">{{subhead}}</p>
        {{{byline}}}
      </div>
    </header>
    <figure class="post-cover wrap"><img src="{{imagem}}" alt="{{imagem_alt}}" width="1200" height="675" fetchpriority="high"></figure>
    <div class="wrap post-layout">
      {{{sumario}}}
      <div class="post-content">
{{{html}}}
{{{faq}}}
        {{{tags}}}
        {{{autor_box}}}
      </div>
    </div>
  </article>

  <section class="block blog-list post-related">
    <div class="wrap">
      <h2 class="related-title">{{relacionados_titulo}}</h2>
      {{{relacionados}}}
    </div>
  </section>

</main>
