<!--
title: {{titulo_pagina}}
description: {{descricao}}
nav: blog
-->
<main class="theme-light">
  <section class="page-hero blog-hero">
    <div class="hero-grid-bg" aria-hidden="true"></div>
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="wrap">
      <nav class="crumbs" aria-label="Você está em">{{{crumbs}}}</nav>
      <span class="kicker">{{kicker}}</span>
      <h1>{{{h1}}}</h1>
      <p class="lead">{{lead}}</p>
      {{{aviso}}}
    </div>
  </section>

  <section class="block blog-list">
    <div class="wrap">
{{{conteudo}}}
    </div>
  </section>

  <section class="cta-band">
    <div class="wrap">
      <span class="kicker">Diagnóstico gratuito</span>
      <h2 style="margin-top:14px">Quer ver isso na sua empresa?</h2>
      <p>Conte qual tarefa mais pesa na sua semana e mostramos onde um agente pode ajudar.</p>
      <div class="hero-actions"><a class="btn" href="/#contato">Quero um diagnóstico gratuito <span aria-hidden="true">→</span></a></div>
    </div>
  </section>
</main>
